# Build the documentation site from main and publish it to the orphan
# branch gh-pages, which GitHub Pages serves (Settings > Pages >
# Deploy from a branch: gh-pages / (root)).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xsltproc libxml2-utils pandoc python3-lxml

      - name: Build site
        run: tools/build_site.sh _site

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages
            git worktree add -q pub -B gh-pages origin/gh-pages
          else
            git worktree add -q --orphan -b gh-pages pub
          fi
          find pub -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. pub/
          cd pub
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged"
          else
            git commit -q -m "Publish site from ${GITHUB_SHA::7}" -m "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push -q origin gh-pages
          fi
