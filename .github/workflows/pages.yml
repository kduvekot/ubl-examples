# Build the documentation site from main and publish it to the orphan
# branch gh-pages, which GitHub Pages serves (Settings > Pages >
# Deploy from a branch: gh-pages / (root)).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    # Pinned, so that a new Ubuntu comes only when chosen (with a fresh package cache and a test run).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      # A run that starts late (after an outage, say) must not publish an older
      # version over a newer one: it publishes only while its commit is still the
      # head of main. The same check is repeated just before publishing, because
      # the build takes a few minutes.
      - name: Check that this is the newest commit on main
        id: newest
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at ${head::7}, newer than ${GITHUB_SHA::7}: skipping, the run for the newer commit publishes the site"
          fi

      # The packages (pandoc alone is about 29 MB; numpy, Pillow and the fonts draw the map sheet) are kept between runs: on
      # 2026-11-18 the Ubuntu mirror served them at about 55 kB/s and the install
      # took ten minutes instead of twenty seconds. apt still checks for newer
      # versions and downloads only what the cache lacks.
      - name: Restore the package cache
        if: steps.newest.outputs.newest == 'true'
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: apt-ubuntu-26.04-${{ runner.arch }}-xsltproc-libxml2-utils-pandoc-python3-lxml-numpy-pil-dejavu-v1

      - name: Install tools
        if: steps.newest.outputs.newest == 'true'
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-cache" \
            -o Acquire::http::Timeout=30 -o Acquire::Retries=3 \
            xsltproc libxml2-utils pandoc python3-lxml python3-numpy python3-pil fonts-dejavu-core
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      # The printed map sheet takes about a minute to draw; tools/map_sheet.py keeps the last one with the fingerprint
      # of all its inputs in .cache/map-sheet and draws it again only when the fingerprint differs. The cache is kept
      # between runs, keyed on the files the sheet is made from (the world data, the terrain, the tools and the
      # drawing script); a run with a new key starts from the newest earlier cache, and the fingerprint decides.
      - name: Restore the map sheet cache
        if: steps.newest.outputs.newest == 'true'
        uses: actions/cache@v5
        with:
          path: .cache/map-sheet
          key: map-sheet-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('world/*.json', 'world/terrain/*.png', 'tools/*.py', 'analysis/world-position/refine_map.py') }}
          restore-keys: map-sheet-ubuntu-26.04-${{ runner.arch }}-

      # The picture of the 3D map on the home page (tools/map_still.py, a headless Chrome) is kept the same way in
      # .cache/map-still, with the fingerprint of the map page (which carries all the map's data) and Chrome's version.
      - name: Restore the map picture cache
        if: steps.newest.outputs.newest == 'true'
        uses: actions/cache@v5
        with:
          path: .cache/map-still
          key: map-still-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('site/world.html', 'world/*.json', 'world/terrain/*.png', 'tools/*.py') }}
          restore-keys: map-still-ubuntu-26.04-${{ runner.arch }}-

      - name: Build site
        if: steps.newest.outputs.newest == 'true'
        run: tools/build_site.sh _site

      - name: Publish to gh-pages
        if: steps.newest.outputs.newest == 'true'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved to ${head::7} during the build: not publishing ${GITHUB_SHA::7}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages
            git worktree add -q pub -B gh-pages origin/gh-pages
          else
            git worktree add -q --orphan -b gh-pages pub
          fi
          find pub -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. pub/
          cd pub
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged"
          else
            git commit -q -m "Publish site from ${GITHUB_SHA::7}" -m "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push -q origin gh-pages
          fi
