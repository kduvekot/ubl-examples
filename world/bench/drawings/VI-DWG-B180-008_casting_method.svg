<text class="txt" x="160.00" y="32.00" font-size="2.8" text-anchor="middle" font-weight="bold">PLAN OF THE MOULD, COPE REMOVED: two castings, sprue, runner, ingates</text>
<text class="txt" x="25.00" y="212.00" font-size="3.0" text-anchor="start" font-weight="bold">Notes</text>
<text class="txt" x="25.00" y="216.50" font-size="2.3" text-anchor="start" font-weight="normal">Two frames per mould (one bench), mirrored; sprue between them,</text>
<text class="txt" x="25.00" y="220.20" font-size="2.3" text-anchor="start" font-weight="normal">runner 26 x 22 mm, 186 mm long; one ingate into each main</text>
<text class="txt" x="25.00" y="223.90" font-size="2.3" text-anchor="start" font-weight="normal">junction J (10 x 10 mm). Choke (sprue) Ø19 mm.</text>
<text class="txt" x="25.00" y="227.60" font-size="2.3" text-anchor="start" font-weight="normal">Pouring 23 kg in about 7 s (t = 1.4√W), head 250 mm.</text>
<text class="txt" x="25.00" y="231.30" font-size="2.3" text-anchor="start" font-weight="normal">Ductile cast iron, green sand; pour 1400–1440 °C; Mg-treated and inoculated.</text>
<text class="txt" x="25.00" y="235.00" font-size="2.3" text-anchor="start" font-weight="normal">Directly applied risering (QIT/Karsay): significant modulus 3.5 mm ≤ 4 mm,</text>
<text class="txt" x="25.00" y="238.70" font-size="2.3" text-anchor="start" font-weight="normal">so no risers; graphite expansion feeds the solidification, the sprue</text>
<text class="txt" x="25.00" y="242.40" font-size="2.3" text-anchor="start" font-weight="normal">the liquid contraction through gates 10 x 10 mm (4 MN, MN 2.4 mm), 49 mm long.</text>
<text class="txt" x="25.00" y="246.10" font-size="2.3" text-anchor="start" font-weight="normal">Poured 24.0 kg for 20.4 kg of castings: yield 85 %.</text>
