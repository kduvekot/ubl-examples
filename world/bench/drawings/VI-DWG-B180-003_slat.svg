<text class="txt" x="259.00" y="196.90" font-size="2.5" text-anchor="start" font-weight="normal">4 x Ø9 through</text>
<text class="txt" x="256.00" y="135.50" font-size="2.0" text-anchor="start" font-weight="normal">break</text>
<text class="txt" x="232.00" y="205.00" font-size="3.0" text-anchor="start" font-weight="bold">Notes</text>
<text class="txt" x="232.00" y="209.50" font-size="2.2" text-anchor="start" font-weight="normal">1  From May 2026: 1800 x 95 x 45, European ash graded LS13 (EN 338 D40)</text>
<text class="txt" x="232.00" y="213.10" font-size="2.2" text-anchor="start" font-weight="normal">   before thermal modification at about 212 °C; delivered at about 5 %</text>
<text class="txt" x="232.00" y="216.70" font-size="2.2" text-anchor="start" font-weight="normal">   moisture, 554 kg/m³, mass 4.24 kg. Benches until April: 1800 x 95</text>
<text class="txt" x="232.00" y="220.30" font-size="2.2" text-anchor="start" font-weight="normal">   x 38 oak heartwood, kiln-dried 12 %, D30, 690 kg/m³, 4.45 kg.</text>
<text class="txt" x="232.00" y="223.90" font-size="2.2" text-anchor="start" font-weight="normal">2  Holes pre-drilled Ø9; in thermally modified ash the square seat</text>
<text class="txt" x="232.00" y="227.50" font-size="2.2" text-anchor="start" font-weight="normal">   of the bolt neck is pre-formed (8.2 mm square, 5 mm deep).</text>
<text class="txt" x="232.00" y="231.10" font-size="2.2" text-anchor="start" font-weight="normal">3  Grain parallel to the length; no knots over 20 mm within</text>
<text class="txt" x="232.00" y="234.70" font-size="2.2" text-anchor="start" font-weight="normal">   150 mm of the ends; seal the end grain (wax emulsion).</text>
<text class="txt" x="232.00" y="238.30" font-size="2.2" text-anchor="start" font-weight="normal">4  Holes on the centre line of the width, at 80 and 120 mm from</text>
<text class="txt" x="232.00" y="241.90" font-size="2.2" text-anchor="start" font-weight="normal">   each end (end distance a3,t = max(7d; 80 mm), EN 1995-1-1).</text>
<text class="txt" x="232.00" y="245.50" font-size="2.2" text-anchor="start" font-weight="normal">5  Same slat for seat and back; 5 per bench.</text>
