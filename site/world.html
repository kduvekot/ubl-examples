<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive map of the UBL example world: three countries, the parties, their supply chains and transport.">
<title>UBL World Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a game screen. Toolbar on top, the isometric map fills the left,
   a party panel on the right (below the map on narrow screens).
   Single dark theme by choice: it is a game world, it looks the same on any host. */
:root {
  color-scheme: dark;
  --ui-bg: #1c2230;        /* panels and toolbar */
  --ui-bg-2: #252d3f;      /* raised controls */
  --ui-line: #3a4560;
  --ui-text: #e9edf5;
  --ui-muted: #9aa6bf;
  --sign: #11151f;         /* map signs */
  --c-commerce: #e8a33d;   /* buyers, sellers, warehouses */
  --c-logistics: #4fa3e3;  /* carriers, forwarders, ports */
  --c-government: #b07ce8; /* customs, registries, authorities */
  --c-finance: #e6d36a;    /* banks, insurer */
  --c-procurement: #4cc9a6;/* contracting authority, tenderers */
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 14px/1.5 var(--font-text);
  display: flex; flex-direction: column; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ui-bg); border-bottom: 2px solid #0d1018; box-shadow: inset 0 -1px 0 var(--ui-line); }
.home-link { color: inherit; text-decoration: none; }
.sitelinks { display: flex; gap: 2px; flex-wrap: wrap; }
.sitelinks a { color: var(--ui-muted); text-decoration: none; font: 600 13px/1 var(--font-text); padding: 6px 8px; border-radius: 4px; }
.sitelinks a:hover, .sitelinks a:focus-visible { color: var(--ui-text); background: var(--ui-bg-2); }
.sitelinks a[aria-current="page"] { color: var(--ui-text); box-shadow: inset 0 -2px 0 var(--c-logistics); }
.toolbar h1 { font: 700 20px/1 var(--font-pixel); margin: 0; letter-spacing: .02em; white-space: nowrap; }
.toolbar h1 span { color: var(--c-logistics); }
.layers { display: flex; gap: 6px; flex-wrap: wrap; }
.layers button, .zoom button { font: 500 13px/1 var(--font-pixel); color: var(--ui-text); background: var(--ui-bg-2);
  border: 1px solid var(--ui-line); border-bottom-width: 3px; border-radius: 4px; padding: 6px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.layers button[aria-pressed="false"], #grid[aria-pressed="false"] { opacity: .55; }
.sheet-link { font: 500 13px/1 var(--font-pixel); color: var(--ui-text); background: var(--ui-bg-2); border: 1px solid var(--ui-line);
  border-bottom-width: 3px; border-radius: 4px; padding: 6px 10px; text-decoration: none; white-space: nowrap; }
.sheet-link:hover, .sheet-link:focus-visible { outline: 2px solid var(--c-logistics); outline-offset: 2px; }
.layers button:focus-visible, .zoom button:focus-visible, .party:focus-visible { outline: 2px solid var(--c-logistics); outline-offset: 2px; }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.zoom { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.compass { font: 700 13px/1 var(--font-text); color: var(--ui-muted); min-width: 1.6em; text-align: center; }
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: #2b5d8f; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 12px; font: 500 12px/1.3 var(--font-pixel); color: #fff;
  background: rgba(17,21,31,.78); padding: 6px 9px; border-radius: 4px; pointer-events: none; }
.panel { border-left: 2px solid #0d1018; background: var(--ui-bg); overflow-y: auto; display: flex; flex-direction: column; }
.card { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px 16px; border-bottom: 1px solid var(--ui-line); background: var(--ui-bg-2); }
.card .num { font: 600 12px/1 var(--font-text); color: var(--ui-muted); letter-spacing: .04em; }
.card h2 { font: 700 20px/1.15 var(--font-pixel); margin: 4px 0 8px; text-wrap: balance; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #0f1320; border: 1px solid var(--ui-line); color: var(--ui-muted); }
.card p { margin: 0 0 10px; max-width: 60ch; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.card dt { color: var(--ui-muted); }
.card dd { margin: 0; }
.card .legend { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--ui-line); }
.card .more { margin: 12px 0 0; }
.card .more a { color: var(--c-logistics); font-weight: 600; text-decoration: none; }
.card .more a:hover { text-decoration: underline; }
.card code { font-size: 12px; background: #0f1320; padding: 1px 5px; border-radius: 3px; }
.list { padding: 8px 0 16px; }
.list h3 { font: 700 14px/1 var(--font-pixel); margin: 14px 16px 6px; color: var(--ui-muted); letter-spacing: .05em; text-transform: uppercase; }
.party { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0;
  color: var(--ui-text); font: 13px/1.35 var(--font-text); padding: 5px 16px; cursor: pointer; }
.party:hover, .party[aria-current="true"] { background: var(--ui-bg-2); }
.party .dot { flex: none; transform: translateY(1px); }
.party .role { color: var(--ui-muted); font-size: 12px; }
.foot { margin-top: auto; padding: 12px 16px; font-size: 12px; color: var(--ui-muted); border-top: 1px solid var(--ui-line); }
@media (max-width: 760px) {
  body { overflow: auto; height: auto; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { height: 62vh; min-height: 340px; }
  .panel { border-left: 0; border-top: 2px solid #0d1018; }
  .zoom { margin-left: 0; }
  .layers { flex-wrap: wrap; width: 100%; }                 /* every layer button in view, in two rows if need be */
  .layers button { flex: none; padding: 5px 8px; font-size: 12px; }
  .zoom { flex-wrap: wrap; }
  .card { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
</head>
<body>
<header class="toolbar">
  <a class="home-link" href="index.html" title="The UBL World: home"><h1>UBL <span>World</span></h1></a>
  <nav class="sitelinks" aria-label="Site">
    <a href="world.html" aria-current="page">Map</a><a href="examples.html">Trade</a><a href="parties.html">Parties</a><a href="world-specifications.html">Rules</a><a href="about.html">About</a>
  </nav>
  <div class="layers" role="group" aria-label="Map layers">
    <button id="layer-chain" aria-pressed="true" data-layer="chain"><span class="dot" style="background:var(--c-commerce)"></span>Supply chains</button>
    <button id="layer-transport" aria-pressed="true" data-layer="transport"><span class="dot" style="background:var(--c-logistics)"></span>Transport</button>
    <button id="layer-gov" aria-pressed="true" data-layer="gov"><span class="dot" style="background:var(--c-government)"></span>Government</button>
    <button id="layer-fin" aria-pressed="true" data-layer="fin"><span class="dot" style="background:var(--c-finance)"></span>Finance</button>
    <button id="layer-proc" aria-pressed="true" data-layer="proc"><span class="dot" style="background:var(--c-procurement)"></span>Procurement</button>
  </div>
  <div class="zoom">
    <button id="rot-left" aria-label="Rotate left (Q)" title="Rotate left (Q)">⟲</button>
    <span class="compass" aria-label="View from" title="View direction"><span id="compass">N</span></span>
    <button id="rot-right" aria-label="Rotate right (E)" title="Rotate right (E)">⟳</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-fit">Fit</button>
    <button id="grid" aria-pressed="false" title="Show the tile grid">Grid</button>
    <a class="sheet-link" href="map-sheet.html" title="The printed map sheet (A3, 1 : 2,500,000)">Map sheet</a>
  </div>
</header>

<div class="main">
  <div class="mapwrap">
    <canvas id="map" aria-label="Isometric map of the UBL example world with three countries and their parties"></canvas>
    <div class="hint">Drag to move · scroll or pinch to zoom · ⟲ ⟳ or Q / E to rotate · click a building</div>
  </div>
  <aside class="panel">
    <section class="card" id="card" aria-live="polite"></section>
    <nav class="list" id="list" aria-label="Parties"></nav>
    <p class="foot">A fictional world. Countries: Urvania (XU), Bayvarra (XB) and Lisavu (XL), with ISO user-assigned codes.</p>
  </aside>
</div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------- world data
// Countries, parties, routes and towns come from the world layers (world/*.json); the build puts them here.
const WORLD = /*WORLD_JSON*/ null;
const W = WORLD.model.W, H = WORLD.model.H;   // squares (tiles): 256 x 192 of 3.5 km
const GRID = WORLD.model.grid || 1;           // squares per 14 km (the squares of the first map)
const TW = 32, TH = 16;             // tile size in pixels (isometric)
const COUNTRIES = WORLD.countries;
const CAT = { commerce: "--c-commerce", logistics: "--c-logistics", government: "--c-government", finance: "--c-finance", procurement: "--c-procurement" };
const KIND_NAME = { commerce: "commerce", logistics: "transport", government: "government", finance: "finance", procurement: "procurement" };
const LAYER_OF = { commerce: "chain", logistics: "transport", government: "gov", finance: "fin", procurement: "proc" };

// Parties: number, tile position, country.
const P = WORLD.parties;

// Routes in tile coordinates, each with a mode and a layer. The vehicles come from the transport legs (below).
const ROUTES = WORLD.routes;

// ---------------------------------------------------------------- the world model
// Built by tools/world_model.py from the world layers and checked there; the map only draws it.
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
// the eight steps of the model's road mask (bits 0..7): a diagonal step passes through the corner two squares share
const DIRS8 = [...DIRS, [1, 1], [-1, 1], [-1, -1], [1, -1]];
const KIND = { s: "sea", w: "river", g: "grass", f: "forest", r: "rock", d: "field", h: "heath", m: "marsh" };
const byId = Object.fromEntries(P.map(p => [p.id, p]));
// quarters (model "quarters"): one building that several parties share on one square, a wing for each, round a court
// that opens on its street ("open": the step from the square towards it)
const QUARTERS = WORLD.model.quarters || [], QUARTER_AT = new Map(QUARTERS.map(q => [q.at.join(), q]));
const WING = new Map(QUARTERS.flatMap(q => q.wings.map((pid, k) => [pid, { q, k }])));
const footprint = p => { const [a, b] = p.size || [1, 1], out = []; for (let i = 0; i < a; i++) for (let j = 0; j < b; j++) out.push([p.at[0] + i, p.at[1] + j]); return out; };
const tiles = WORLD.model.tiles.map(col => col.map(m => {
  const t = { land: m.k !== "s" && m.k !== "w", water: m.k === "w", country: m.c, t: KIND[m.k], k: m.k, n: m.n, h: m.h || 0 };
  if (m.b) t.building = byId[m.b];
  if (m.hs) t.house = m.hs;
  if (m.um) { t.urban = m.um; t.density = m.ul || 1; }
  if (m.tr) t.tree = 1;
  if (m.yd) t.yard = 1;
  if (m.br) t.bridge = 1;
  if (m.az) t.approach = 1;
  if (m.es) t.estuary = 1;
  if (m.ms) t.station = 1;
  if (m.mf) t.mf = m.mf;
  if (m.lu) t.lu = m.lu;                               // the land use of its cells (tools/land_use.py)                               // a managed forest's compartments (ages of its sub-squares)
  if (m.tn) t.tunnel = 1;
  if (m.dk != null) t.deck = m.dk;                     // the height of a bridge's deck or a tunnel's way (metres)
  if (m.ab) t.abut = 1;                                // a bridge's or a tunnel's approach (an embankment, a cutting)
  if (m.ov) t.over = m.ov;                             // which way is on the bridge where a road and a rail line cross
  if (m.hb) t.harbour = 1;
  if (m.rd) t.links = { road: new Set(DIRS8.filter((d, bit) => m.rd & (1 << bit)).map(d => d.join())) };
  if (m.rm) t.main = new Set(DIRS8.filter((d, bit) => m.rm & (1 << bit)).map(d => d.join()));   // the main roads' part of "rd"
  if (m.vg) t.village = 1;                             // a village's built-up area (not a town's)
  if (m.rl) { (t.links ||= {}).rail = new Set(); t.pieces = { rail: m.rl }; for (const [a1, b1] of m.rl) { if (a1) t.links.rail.add(a1.join()); if (b1) t.links.rail.add(b1.join()); } }
  return t; }));
const TOWNS = WORLD.towns.map(tw => ({ ...tw }));
const RAPIDS = new Set((WORLD.model.rapids || []).map(q => q.join()));   // the rapids above Ferrano (O153)
// terrain height: one value per tile corner (model "v"); the ground height anywhere is interpolated
// The heights are metres (model "level_m" 1, since O152); HU pixels per metre draws them about 12 times higher than
// true scale (a square, 3.5 km, is TW = 32 pixels wide across its diagonal of 4.95 km), so that hills and valleys read
// at the overview; the sea and the estuary are at 0.
const V = WORLD.model.v, HU = .075 * (WORLD.model.level_m || 1);   // pixels per unit of "v" (a metre)
function heightAt(x, y) { const vx = Math.max(0, Math.min(W, x + .5)), vy = Math.max(0, Math.min(H, y + .5));
  const i0 = Math.min(W - 1, Math.floor(vx)), j0 = Math.min(H - 1, Math.floor(vy)), u = vx - i0, v = vy - j0;
  return V[i0][j0] * (1 - u) * (1 - v) + V[i0 + 1][j0] * u * (1 - v) + V[i0][j0 + 1] * (1 - u) * v + V[i0 + 1][j0 + 1] * u * v; }

// middle of each country's land, for its name on the map

// distance (in squares, diagonal steps count one) from every square to the nearest square where busy() holds, up
// to cap: two passes over the grid
function distanceTo(busy, cap) { const D = new Float32Array(W * H).fill(cap), at = (i, j) => i * H + j;
  for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) if (busy(tiles[i][j])) D[at(i, j)] = 0;
  for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) { let d = D[at(i, j)];
    if (i > 0) d = Math.min(d, D[at(i - 1, j)] + 1, j > 0 ? D[at(i - 1, j - 1)] + 1 : cap, j < H - 1 ? D[at(i - 1, j + 1)] + 1 : cap);
    if (j > 0) d = Math.min(d, D[at(i, j - 1)] + 1); D[at(i, j)] = d; }
  for (let i = W - 1; i >= 0; i--) for (let j = H - 1; j >= 0; j--) { let d = D[at(i, j)];
    if (i < W - 1) d = Math.min(d, D[at(i + 1, j)] + 1, j > 0 ? D[at(i + 1, j - 1)] + 1 : cap, j < H - 1 ? D[at(i + 1, j + 1)] + 1 : cap);
    if (j < H - 1) d = Math.min(d, D[at(i, j + 1)] + 1); D[at(i, j)] = d; }
  return (i, j) => D[at(i, j)]; }

// the centre of each country: the square of its land farthest from its coast and border (its "pole of
// inaccessibility"), which lies inside the country whatever its shape (owner, 2026-11-20)
const CENTRE = (() => { const out = {};
  for (const code of new Set(tiles.flat().filter(t => t.land && t.country).map(t => t.country))) {
    const inner = distanceTo(t => !t.land || t.country !== code, 40 * GRID); let best = null, bd = -1;
    for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) { const t = tiles[i][j];
      if (t.land && t.country === code && inner(i, j) > bd) { bd = inner(i, j); best = [i, j]; } }
    out[code] = best; }
  return out; })();
// a spot for each country name: inside the country, away from buildings and routes
const LABEL_AT = (() => { const G = GRID, near = distanceTo(t => t.building || t.house || t.links, 6 * G), nearB = distanceTo(t => t.building, 3 * G);
  const out = {}; for (const [code, c] of Object.entries(CENTRE)) { let best = null, bs = -1e9;
    for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) { const t = tiles[i][j]; if (!t.land || t.country !== code) continue;
      const edge = [[4,0],[-4,0],[0,4],[0,-4],[3,3],[-3,-3],[3,-3],[-3,3]].some(([a, b]) => !tiles[i + a * G]?.[j + b * G]?.land) ? 5 : 0;
      const score = Math.min(near(i, j) / G, 2) - edge - 1.0 * Math.hypot(i - c[0], j - c[1]) / G; if (score > bs) { bs = score; best = [i, j]; } }
    out[code] = best; }
  for (const tw of TOWNS) { let best = null, bs = -1e9;
    const rr = Math.ceil(tw.r);
    for (let i = tw.c[0] - rr - 3; i <= tw.c[0] + rr + 3; i++) for (let j = tw.c[1] - rr - 3; j <= tw.c[1] + rr + 3; j++) { const t = tiles[i]?.[j]; if (!t?.land || t.building || t.urban) continue;   // beside the built-up area
      const score = Math.min(nearB(i, j), 1.5) - .5 * Math.hypot(i - tw.c[0], j - tw.c[1]); if (score > bs) { bs = score; best = [i, j]; } }
    tw.label = best; }
  return out; })();

// ---------------------------------------------------------------- drawing helpers
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const iso = (i, j) => [(i - j) * TW / 2, (i + j) * TH / 2];
// Rotation in 90-degree steps: the data keeps its original tile coordinates,
// drawing converts them. rot 0..3; R: original -> rotated, RI: rotated -> original.
let rot = 0;
const RW = () => rot % 2 ? H : W, RH = () => rot % 2 ? W : H;
// (written out rather than picked from a list of the four: they are called millions of times while drawing)
const R = (i, j) => rot === 0 ? [i, j] : rot === 1 ? [H - 1 - j, i] : rot === 2 ? [W - 1 - i, H - 1 - j] : [j, W - 1 - i];
const RI = (i, j) => rot === 0 ? [i, j] : rot === 1 ? [j, H - 1 - i] : rot === 2 ? [W - 1 - i, H - 1 - j] : [W - 1 - j, i];
const TOP = Math.max(0, ...V.map(col => Math.max(...col))) * HU;   // the highest ground, in pixels
let OX = H * TW / 2 + 40; const OY = 60 + TOP;     // offset of rotated tile (0,0) on the world canvas
const WORLD_W = (W + H) * TW / 2 + 80, WORLD_H = (W + H) * TH / 2 + 140 + TOP;
// shade and mix are called for every square and cell: their results are kept (with the factor rounded to a step
// finer than a colour step), which makes drawing the overview much quicker
const SHADES = new Map();
const shade = (hex, f) => { const k = Math.round(f * 512); let row = SHADES.get(hex); if (!row) SHADES.set(hex, row = []);
  let out = row[k + 1024]; if (out) return out; f = k / 512;
  const v = parseInt(hex.slice(1), 16); let r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  const m = c => Math.max(0, Math.min(255, Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)))); return row[k + 1024] = `rgb(${m(r)},${m(g)},${m(b)})`; };
function diamond(g, x, y, fill, stroke) { g.beginPath(); g.moveTo(x, y - TH / 2); g.lineTo(x + TW / 2, y); g.lineTo(x, y + TH / 2); g.lineTo(x - TW / 2, y); g.closePath();
  g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); } }
function box(g, x, y, w, d, h, top, side) { // isometric block standing on (x, y)
  const hw = w * TW / 2, hd = d * TH / 2;
  g.beginPath(); g.moveTo(x - hw, y - h); g.lineTo(x, y + hd - h); g.lineTo(x, y + hd); g.lineTo(x - hw, y); g.closePath(); g.fillStyle = shade(side, -.18); g.fill();
  g.beginPath(); g.moveTo(x + hw, y - h); g.lineTo(x, y + hd - h); g.lineTo(x, y + hd); g.lineTo(x + hw, y); g.closePath(); g.fillStyle = shade(side, -.36); g.fill();
  g.beginPath(); g.moveTo(x, y - hd - h); g.lineTo(x + hw, y - h); g.lineTo(x, y + hd - h); g.lineTo(x - hw, y - h); g.closePath(); g.fillStyle = top; g.fill();
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 1; g.stroke();
}

// ---------------------------------------------------------------- static world layer
// The world is drawn in three levels of detail, as web maps do, so that the map stays quick and readable with its
// 256 x 192 squares (O152). Each level is drawn only when it is first needed:
//  0 far: the overview, the whole world drawn once at OV_S of its size: the ground and its land use, the rivers and
//    the coast, the towns (with their streets), the main roads, the railways and the buildings of the parties; no
//    minor roads, no villages or farmsteads, no trees, rocks, hedges or windows;
//  1 middle (view.s from MID_S): chunks of CHUNK x CHUNK world pixels drawn at CHUNK_S[1] of their size, with the
//    minor and access roads thin and faint, and the villages and farmsteads as small clusters of houses;
//  2 close (view.s from DETAIL_S): the chunks at full size, with everything (trees, hedges, rocks, windows).
// A chunk is drawn when it first comes into view (a few per frame) and kept, up to CHUNK_KEEP of them; the level
// below stands in for it until it is drawn. A level fades in over the one below it over FADE of the scale, so that
// the minor roads and the trees do not pop up.
const OV_S = .35, MID_S = .4, DETAIL_S = .62, FADE = 1.25, CHUNK = 1024, CHUNK_S = [0, .5, 1], CHUNK_KEEP = 60;
let overview = null; const chunks = new Map();

  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = cv.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; moved += 10; return; }
  view.x += e.clientX - px; view.y += e.clientY - py; moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py); redraw(); });
const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = 0; cv.classList.remove("dragging");
  if (moved < 5 && e.type === "pointerup") { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 30; for (const p of P) { if (p._sx == null) continue; const d = Math.min(Math.hypot(p._sx - x, p._sy - y + 6), Math.hypot(p._ax - x, p._ay - y + 6));
      if (d < bd) { bd = d; best = p; } }
    select(best, false); } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

window.addEventListener("resize", () => { view.fitted = false; resize(); redraw(); });
document.fonts?.ready.then(() => redraw());       // the world itself has no text: only the signs need the fonts
drawWorld(); resize(); showCard(null);
const fromHash = () => { const p = P.find(p => "#" + p.id === location.hash); if (p) select(p, true); };
fromHash(); window.addEventListener("hashchange", fromHash);
if (reduced) frame(0); else requestAnimationFrame(frame);
})();
