<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive map of the UBL example world: three countries, the parties, their supply chains and transport.">
<title>UBL World Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a game screen. Toolbar on top, the isometric map fills the left,
   a party panel on the right (below the map on narrow screens).
   Single dark theme by choice: it is a game world, it looks the same on any host. */
:root {
  color-scheme: dark;
  --ui-bg: #1c2230;        /* panels and toolbar */
  --ui-bg-2: #252d3f;      /* raised controls */
  --ui-line: #3a4560;
  --ui-text: #e9edf5;
  --ui-muted: #9aa6bf;
  --sign: #11151f;         /* map signs */
  --c-commerce: #e8a33d;   /* buyers, sellers, warehouses */
  --c-logistics: #4fa3e3;  /* carriers, forwarders, ports */
  --c-government: #b07ce8; /* customs, registries, authorities */
  --c-finance: #e6d36a;    /* banks, insurer */
  --c-procurement: #4cc9a6;/* contracting authority, tenderers */
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 14px/1.5 var(--font-text);
  display: flex; flex-direction: column; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ui-bg); border-bottom: 2px solid #0d1018; box-shadow: inset 0 -1px 0 var(--ui-line); }
.back { color: var(--ui-muted); text-decoration: none; font: 700 18px/1 var(--font-text); padding: 4px 6px; border-radius: 4px; }
.back:hover { color: var(--ui-text); background: var(--ui-bg-2); }
.toolbar h1 { font: 700 20px/1 var(--font-pixel); margin: 0; letter-spacing: .02em; white-space: nowrap; }
.toolbar h1 span { color: var(--c-logistics); }
.layers { display: flex; gap: 6px; flex-wrap: wrap; }
.layers button, .zoom button { font: 500 13px/1 var(--font-pixel); color: var(--ui-text); background: var(--ui-bg-2);
  border: 1px solid var(--ui-line); border-bottom-width: 3px; border-radius: 4px; padding: 6px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.layers button[aria-pressed="false"], #grid[aria-pressed="false"] { opacity: .55; }
.layers button:focus-visible, .zoom button:focus-visible, .party:focus-visible { outline: 2px solid var(--c-logistics); outline-offset: 2px; }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.zoom { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.compass { font: 700 13px/1 var(--font-text); color: var(--ui-muted); min-width: 1.6em; text-align: center; }
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: #2b5d8f; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 12px; font: 500 12px/1.3 var(--font-pixel); color: #fff;
  background: rgba(17,21,31,.78); padding: 6px 9px; border-radius: 4px; pointer-events: none; }
.panel { border-left: 2px solid #0d1018; background: var(--ui-bg); overflow-y: auto; display: flex; flex-direction: column; }
.card { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px 16px; border-bottom: 1px solid var(--ui-line); background: var(--ui-bg-2); }
.card .num { font: 600 12px/1 var(--font-text); color: var(--ui-muted); letter-spacing: .04em; }
.card h2 { font: 700 20px/1.15 var(--font-pixel); margin: 4px 0 8px; text-wrap: balance; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #0f1320; border: 1px solid var(--ui-line); color: var(--ui-muted); }
.card p { margin: 0 0 10px; max-width: 60ch; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.card dt { color: var(--ui-muted); }
.card dd { margin: 0; }
.card .more { margin: 12px 0 0; }
.card .more a { color: var(--c-logistics); font-weight: 600; text-decoration: none; }
.card .more a:hover { text-decoration: underline; }
.card code { font-size: 12px; background: #0f1320; padding: 1px 5px; border-radius: 3px; }
.list { padding: 8px 0 16px; }
.list h3 { font: 700 14px/1 var(--font-pixel); margin: 14px 16px 6px; color: var(--ui-muted); letter-spacing: .05em; text-transform: uppercase; }
.party { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0;
  color: var(--ui-text); font: 13px/1.35 var(--font-text); padding: 5px 16px; cursor: pointer; }
.party:hover, .party[aria-current="true"] { background: var(--ui-bg-2); }
.party .n { font: 700 12px/1 var(--font-text); min-width: 2.6em; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
.party .new { font-size: 11px; color: var(--c-procurement); margin-left: auto; }
.foot { margin-top: auto; padding: 12px 16px; font-size: 12px; color: var(--ui-muted); border-top: 1px solid var(--ui-line); }
@media (max-width: 760px) {
  body { overflow: auto; height: auto; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { height: 62vh; min-height: 340px; }
  .panel { border-left: 0; border-top: 2px solid #0d1018; }
  .zoom { margin-left: 0; }
  .layers { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
  .layers button { flex: none; }
  .card { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
</head>
<body>
<header class="toolbar">
  <a class="back" href="index.html" title="UBL Example Documents">←</a>
  <h1>UBL <span>World</span></h1>
  <div class="layers" role="group" aria-label="Map layers">
    <button id="layer-chain" aria-pressed="true" data-layer="chain"><span class="dot" style="background:var(--c-commerce)"></span>Supply chains</button>
    <button id="layer-transport" aria-pressed="true" data-layer="transport"><span class="dot" style="background:var(--c-logistics)"></span>Transport</button>
    <button id="layer-gov" aria-pressed="true" data-layer="gov"><span class="dot" style="background:var(--c-government)"></span>Government</button>
    <button id="layer-fin" aria-pressed="true" data-layer="fin"><span class="dot" style="background:var(--c-finance)"></span>Finance</button>
    <button id="layer-proc" aria-pressed="true" data-layer="proc"><span class="dot" style="background:var(--c-procurement)"></span>Procurement</button>
  </div>
  <div class="zoom">
    <button id="rot-left" aria-label="Rotate left (Q)" title="Rotate left (Q)">⟲</button>
    <span class="compass" aria-label="View from" title="View direction"><span id="compass">N</span></span>
    <button id="rot-right" aria-label="Rotate right (E)" title="Rotate right (E)">⟳</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-fit">Fit</button>
    <button id="grid" aria-pressed="false" title="Show the tile grid">Grid</button>
  </div>
</header>

<div class="main">
  <div class="mapwrap">
    <canvas id="map" aria-label="Isometric map of the UBL example world with three countries and their parties"></canvas>
    <div class="hint">Drag to move · scroll or pinch to zoom · ⟲ ⟳ or Q / E to rotate · click a building</div>
  </div>
  <aside class="panel">
    <section class="card" id="card" aria-live="polite"></section>
    <nav class="list" id="list" aria-label="Parties"></nav>
    <p class="foot">Example world, work in progress. Countries: Urvania (XU), Bayvarra (XB) and Lisavu (XL), with ISO user-assigned codes. Parties 27 and up are proposed additions to the 26+C set.</p>
  </aside>
</div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------- world data
const W = 64, H = 48;               // tiles
const TW = 32, TH = 16;             // tile size in pixels (isometric)
// Countries, parties, routes and towns come from the world layers (world/*.json); the build puts them here.
const WORLD = {"countries":{"XU":{"name":"Urvania","note":"Mainland, inland. Raw materials and manufacturing.","alpha3":"XUR","numeric":"901","languages":["en"],"currency":{"code":"XUF","numeric":"911","name":"Ferra","minor_units":0,"note":"ISO 4217 style: the country code and the initial of the currency's name; checked against the current ISO 4217 list. No minor unit: amounts are whole ferra, as with the Japanese yen."},"tax":{"summary":"Value added tax in the style of the EU VAT: charged at every stage, deducted by businesses, not charged on exports.","schemes":[{"id":"VAT","name":"Value added tax","rates":{"standard":20,"reduced":9},"exports":"not charged; the export is shown with its exemption reason"}]},"registry":{"name":"Commercial register of Urvania","id_format":"XU-R- and 6 digits","example":"XU-R-104233"},"tax_id":{"format":"XU and 9 digits, the last a check digit (weights 9..2, modulus 11)"},"address":{"lines":["StreetName BuildingNumber","PostalZone CityName"],"postal_zone":"4 digits","subdivisions":null}},"XB":{"name":"Bayvarra","note":"Mainland, coast. Distribution, retail, seaport and airport hub.","alpha3":"XBY","numeric":"902","languages":["en"],"currency":{"code":"XBL","numeric":"912","name":"Lume","minor_units":2,"note":"ISO 4217 style: the country code and the initial of the currency's name; checked against the current ISO 4217 list. Two decimals, the most common case."},"tax":{"summary":"A federal country: its states levy a retail sales tax, charged once, on the sale to the final consumer. Sales to businesses that resell, exports and sales to public bodies are exempt, and the invoice says so.","schemes":[{"id":"STT","name":"State sales tax","levied_by":"state","rates_by_state":{"Coastal State":6.5,"Upland State":5.0},"exempt":["sale for resale","export","sale to a public body"]}]},"registry":{"name":"Federal business register of Bayvarra","id_format":"8 digits","example":"20417733"},"tax_id":{"format":"state code (UL Upland State, CO Coastal State), hyphen, 7 digits (sales tax permit of the state)"},"address":{"lines":["BuildingNumber StreetName","CityName CountrySubentity PostalZone"],"postal_zone":"5 digits","subdivisions":{"UL":"Upland State","CO":"Coastal State"}},"subdivision_rule":{"column":29,"west":"Upland State","east":"Coastal State","note":"The state border runs north-south at map column 29: the border region and the distributor are in Upland State, Lumeport and the coast in Coastal State."}},"XL":{"name":"Lisavu","note":"Island. The overseas buyer, reached by sea and air.","alpha3":"XLS","numeric":"903","languages":["en"],"currency":{"code":"XLC","numeric":"913","name":"Coral","minor_units":3,"note":"ISO 4217 style: the country code and the initial of the currency's name; checked against the current ISO 4217 list. Three decimals, as with the Bahraini or Kuwaiti dinar."},"tax":{"summary":"An island without a general sales tax or VAT: the state is financed by customs duty and an import consumption tax, both collected by customs at import. Domestic sales carry no tax, and the invoice says so.","schemes":[{"id":"CUD","name":"Customs duty","levied_on":"import, customs value"},{"id":"IMP","name":"Import consumption tax","rate":10,"levied_on":"import, customs value plus duty"}]},"registry":{"name":"Island companies register","id_format":"IC and 5 digits","example":"IC40912"},"tax_id":{"format":"the companies register number; there is no separate tax number"},"address":{"lines":["BuildingNumber StreetName","CityName"],"postal_zone":null,"subdivisions":null}}},"parties":[{"id":"4-xu","n":"4","name":"Raw Material Supplier","cat":"commerce","c":"XU","at":[9,10],"h":2,"kind":"mine","what":"Mines the ore at the start of the chain and sells it to the manufacturer.","how":"A mine sells a few products in large volumes to a small number of customers. With UBL, its orders, despatch advices and invoices carry the same quantities, lot numbers and weights from the first document to the last, so the buyer can match them without retyping weighbridge tickets.","identity":{"name":"Serravona Mining","kind":"company","registry_id":"XU-R-104137","endpoint":"XU:XU-R-104137","contact":{"name":"Sales office","email":"sales@serravona.example"},"tax_id":"XU007289704","address":{"StreetName":"Strada della Miniera","BuildingNumber":"10","CityName":"Serravona","PostalZone":"4110"},"account":{"bank":"23-xu","number":"XU56CREV0000104729"}},"sends":"Despatch Advice, Invoice","receives":"Order, Remittance Advice","roles":"SellerSupplierParty, DespatchParty, ConsignorParty, DespatchSupplierParty, AccountingSupplierParty","label":"Serravona Mining"},{"id":"5-xu","n":"5","name":"Manufacturer","cat":"commerce","c":"XU","at":[14,18],"h":3,"kind":"factory","what":"Makes park benches and street furniture: frames from steel made from the mine's ore, slats from the sawmill in Bayvarra, packed in recycled packaging from Bayvarra. Sells to the distributor abroad and tenders in public procurement.","how":"The manufacturer sits in the middle of the chain: it buys, produces, sells, exports and tenders. UBL gives it one vocabulary for all of that, from the order it places with the mine to the certificate of origin and the tender it submits to a public buyer, so the same item, party and price data are reused instead of re-entered for every partner.","size":[2,2],"identity":{"name":"Valdara Industries","kind":"company","registry_id":"XU-R-104274","endpoint":"XU:XU-R-104274","contact":{"name":"Order desk","email":"order@valdara.example"},"tax_id":"XU007299291","address":{"StreetName":"Via delle Officine","BuildingNumber":"17","CityName":"Ferrano","PostalZone":"4120"},"account":{"bank":"23-xu","number":"XU20CREV0000209458"}},"sends":"Order, Transport Execution Plan Request, Remittance Advice, Order Response, Export Customs Declaration, Certificate of Origin, Invoice, Transit Customs Declaration, Tenderer Qualification, Tender, Waste Notification, Request For Quotation, Import Customs Declaration","receives":"Transport Execution Plan, Despatch Advice, Waybill, Invoice, Order, Remittance Advice, Call For Tenders, Awarded Notification, Goods Item Passport, Utility Statement, Quotation","roles":"BuyerCustomerParty, DeliveryParty, SenderParty, TransportUserParty, ConsigneeParty, ReceiverParty, DeliveryCustomerParty, AccountingCustomerParty, SellerSupplierParty, ConsignorParty, ExporterParty, AccountingSupplierParty, TransitExporterParty, BusinessParty, MainQualifyingParty, InterestedParty, TendererParty, WinningParty, HolderParty, NotifierParty, WasteProducerParty, SubscriberParty, CustomerParty, ImporterParty","label":"Valdara Industries"},{"id":"8-xu","n":"8","name":"Seller's Warehouse (3PL)","cat":"commerce","c":"XU","at":[16,22],"h":2,"kind":"warehouse","what":"Picks, packs and hands the goods to the carrier for the manufacturer; knows nothing about prices.","how":"A third-party warehouse acts on instructions from its client but never sees the commercial terms. UBL separates the two: the warehouse sends despatch advices and inventory reports with exactly the logistic details (packages, weights, serial numbers) while prices stay in the documents between seller and buyer.","size":[2,1],"identity":{"name":"Castrano Logistics","kind":"company","registry_id":"XU-R-104411","endpoint":"XU:XU-R-104411","contact":{"name":"Warehouse office","email":"warehouse@castrano.example"},"tax_id":"XU007308887","address":{"StreetName":"Via del Magazzino","BuildingNumber":"24","CityName":"Ferrano","PostalZone":"4130"},"account":{"bank":"23-xu","number":"XU81CREV0000314187"}},"sends":"Despatch Advice","receives":"Receipt Advice, Utility Statement","roles":"DespatchParty, DespatchSupplierParty, ReceiverParty, SubscriberParty","label":"Castrano Logistics"},{"id":"7-xu","n":"7","name":"Waste Processor","cat":"commerce","c":"XU","at":[11,24],"h":2,"kind":"waste","what":"Takes production waste from the manufacturer and invoices the removal.","how":"Waste movements must be announced and tracked before the waste leaves the site. UBL's waste notification and waste movement documents describe the waste, its producer and the facility that recovers or disposes of it, and the same parties then appear on the invoice for the removal service.","identity":{"name":"Rinova Recovery","kind":"company","registry_id":"XU-R-104548","endpoint":"XU:XU-R-104548","contact":{"name":"Customer service","email":"customer@rinova.example"},"tax_id":"XU007318479","address":{"StreetName":"Via del Riciclo","BuildingNumber":"31","CityName":"Ferrano","PostalZone":"4140"},"account":{"bank":"23-xu","number":"XU45CREV0000418916"}},"sends":"Waste Movement, Invoice, Order Response, Transport Execution Plan Request, Export Customs Declaration, Despatch Advice","receives":"Order, Transport Execution Plan, Waybill, Invoice, Remittance Advice","roles":"RecoveryFacilityParty, SenderParty, AccountingSupplierParty, SellerSupplierParty, TransportUserParty, ConsignorParty, ReceiverParty, ExporterParty, AccountingCustomerParty, BuyerCustomerParty, DespatchSupplierParty","label":"Rinova Recovery"},{"id":"14-xu","n":"14","name":"Rail Carrier","cat":"logistics","c":"XU","at":[8,15],"h":2,"kind":"depot","what":"Runs the ore trains from the mine to the factory and container trains to the border.","how":"A rail carrier plans capacity on a fixed timetable. UBL transport documents let its customers request and confirm transport plans and receive status updates per train and wagon, with the same consignment references the forwarder and the receiving terminal use.","identity":{"name":"Ferrano Rail Cargo","kind":"company","registry_id":"XU-R-104685","endpoint":"XU:XU-R-104685","contact":{"name":"Freight desk","email":"freight@ferranorail.example"},"tax_id":"XU007328060","address":{"StreetName":"Viale della Stazione","BuildingNumber":"38","CityName":"Serravona","PostalZone":"4150"},"account":{"bank":"23-xu","number":"XU09CREV0000523645"}},"sends":"Transport Execution Plan, Waybill, Invoice","receives":"Transport Execution Plan Request, Transportation Status","roles":"CarrierParty, ReceiverParty, TransportServiceProviderParty, SenderParty, AccountingSupplierParty, SellerSupplierParty","label":"Ferrano Rail Cargo"},{"id":"13-xu","n":"13","name":"Road Carrier","cat":"logistics","c":"XU","at":[17,25],"h":1,"kind":"depot","what":"Trucks the goods across the land border to the distributor; last-mile delivery.","how":"Road carriers handle many short jobs with frequent changes. With UBL they receive transport instructions, report status at each stop and invoice the freight in one structured format, so every customer, large or small, can process them automatically.","identity":{"name":"Trasvia Haulage","kind":"company","registry_id":"XU-R-104822","endpoint":"XU:XU-R-104822","contact":{"name":"Planning desk","email":"planning@trasvia.example"},"tax_id":"XU007337656","address":{"StreetName":"Via dei Trasporti","BuildingNumber":"45","CityName":"Ferrano","PostalZone":"4160"},"account":{"bank":"23-xu","number":"XU70CREV0000628374"}},"sends":"Waybill, Transportation Status, Invoice","receives":"Transport Execution Plan Request","roles":"CarrierParty, ReceiverParty, TransportServiceProviderParty, SenderParty, AccountingSupplierParty, SellerSupplierParty, SubstituteCarrierParty","label":"Trasvia Haulage"},{"id":"15-xu","n":"15","name":"Inland Waterway Carrier","cat":"logistics","c":"XU","at":[12,26],"h":1,"kind":"quay","what":"Moves bulk on the river from Urvania down to the coast of Bayvarra.","how":"Inland waterway transport moves large volumes slowly. UBL transport execution plans and waybills carry the barge, the loading and discharge quays and the cargo per hold, so shippers and terminals can plan around long transit times.","identity":{"name":"Fiumella Barges","kind":"company","registry_id":"XU-R-104959","endpoint":"XU:XU-R-104959","contact":{"name":"Chartering desk","email":"chartering@fiumella.example"},"tax_id":"XU007347248","address":{"StreetName":"Banchina del Fiume","BuildingNumber":"52","CityName":"Ferrano","PostalZone":"4170"},"account":{"bank":"23-xu","number":"XU34CREV0000733103"}},"sends":"Transport Execution Plan, Waybill, Invoice","receives":"Transport Execution Plan Request","roles":"ReceiverParty, TransportServiceProviderParty, SenderParty, CarrierParty, AccountingSupplierParty, SellerSupplierParty","label":"Fiumella Barges"},{"id":"18-xu","n":"18","name":"Rail Hub / Intermodal Terminal","cat":"logistics","c":"XU","at":[19,18],"h":2,"kind":"terminal","what":"Transfers containers between rail and road at the border; manages tracks and slots.","how":"An intermodal terminal is where rail and road meet. UBL status messages and transport reports let it tell carriers and forwarders when a container arrived, was transferred or left, using the same equipment and consignment identifiers on both sides of the transfer.","size":[2,1],"on":"rail","identity":{"name":"Ferrano Intermodal Hub","kind":"company","registry_id":"XU-R-105096","endpoint":"XU:XU-R-105096","contact":{"name":"Terminal control","email":"terminal@ferranohub.example"},"tax_id":"XU007356833","address":{"StreetName":"Via del Terminal","BuildingNumber":"59","CityName":"Ferrano","PostalZone":"4180"}},"sends":"Transportation Status","receives":"–","roles":"SenderParty, TerminalOperatorParty","label":"Ferrano Intermodal Hub"},{"id":"23-xu","n":"23","name":"Seller's Bank","cat":"finance","c":"XU","at":[12,21],"h":3,"kind":"bank","what":"Holds the manufacturer's account and receives the payments from abroad.","how":"The seller's bank receives payments from many countries. Because UBL invoices carry the payee account and a payment reference, and remittance advices repeat that reference, incoming payments can be matched to the right invoices automatically.","identity":{"name":"Crevalto Bank","kind":"bank","registry_id":"XU-R-105233","endpoint":"XU:XU-R-105233","contact":{"name":"Trade services","email":"trade@crevalto.example"},"tax_id":"XU007366425","address":{"StreetName":"Piazza della Banca document.getElementById("zoom-fit").onclick = () => { fit(); redraw(); };
document.getElementById("grid").onclick = e => { showGrid = !showGrid; e.currentTarget.setAttribute("aria-pressed", showGrid); drawWorld(); redraw(); };
document.getElementById("rot-left").onclick = () => rotate(-1);
document.getElementById("rot-right").onclick = () => rotate(1);
window.addEventListener("keydown", e => { if (e.target.closest("input, textarea")) return;
  if (e.key === "q" || e.key === "Q") rotate(-1); else if (e.key === "e" || e.key === "E") rotate(1);
  else if (e.key === "+" || e.key === "=") document.getElementById("zoom-in").click(); else if (e.key === "-") document.getElementById("zoom-out").click(); });
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : .89, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pointers = new Map(); let moved = 0, pinch = 0;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; cv.classList.add("dragging"); });
cv.addEventListener("pointermove", e => { if (!pointers.has(e.pointerId)) return; const [px, py] = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = cv.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; moved += 10; return; }
  view.x += e.clientX - px; view.y += e.clientY - py; moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py); redraw(); });
const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = 0; cv.classList.remove("dragging");
  if (moved < 5 && e.type === "pointerup") { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 30; for (const p of P) { if (p._sx == null) continue; const d = Math.hypot(p._sx - x, p._sy - y + 6); if (d < bd) { bd = d; best = p; } }
    select(best, false); } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

window.addEventListener("resize", () => { view.fitted = false; resize(); redraw(); });
document.fonts?.ready.then(() => { drawWorld(); redraw(); });
drawWorld(); resize(); showCard(null);
const fromHash = () => { const p = P.find(p => "#" + p.id === location.hash); if (p) select(p, true); };
fromHash(); window.addEventListener("hashchange", fromHash);
if (reduced) frame(0); else requestAnimationFrame(frame);
})();
</script>
