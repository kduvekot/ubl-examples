<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive map of the UBL example world: three countries, the parties, their supply chains and transport.">
<title>UBL World Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a game screen. Toolbar on top, the isometric map fills the left,
   a party panel on the right (below the map on narrow screens).
   Single dark theme by choice: it is a game world, it looks the same on any host. */
:root {
  color-scheme: dark;
  --ui-bg: #1c2230;        /* panels and toolbar */
  --ui-bg-2: #252d3f;      /* raised controls */
  --ui-line: #3a4560;
  --ui-text: #e9edf5;
  --ui-muted: #9aa6bf;
  --sign: #11151f;         /* map signs */
  --c-commerce: #e8a33d;   /* buyers, sellers, warehouses */
  --c-logistics: #4fa3e3;  /* carriers, forwarders, ports */
  --c-government: #b07ce8; /* customs, registries, authorities */
  --c-finance: #e6d36a;    /* banks, insurer */
  --c-procurement: #4cc9a6;/* contracting authority, tenderers */
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 14px/1.5 var(--font-text);
  display: flex; flex-direction: column; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ui-bg); border-bottom: 2px solid #0d1018; box-shadow: inset 0 -1px 0 var(--ui-line); }
.back { color: var(--ui-muted); text-decoration: none; font: 700 18px/1 var(--font-text); padding: 4px 6px; border-radius: 4px; }
.back:hover { color: var(--ui-text); background: var(--ui-bg-2); }
.toolbar h1 { font: 700 20px/1 var(--font-pixel); margin: 0; letter-spacing: .02em; white-space: nowrap; }
.toolbar h1 span { color: var(--c-logistics); }
.layers { display: flex; gap: 6px; flex-wrap: wrap; }
.layers button, .zoom button { font: 500 13px/1 var(--font-pixel); color: var(--ui-text); background: var(--ui-bg-2);
  border: 1px solid var(--ui-line); border-bottom-width: 3px; border-radius: 4px; padding: 6px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.layers button[aria-pressed="false"], #grid[aria-pressed="false"] { opacity: .55; }
.layers button:focus-visible, .zoom button:focus-visible, .party:focus-visible { outline: 2px solid var(--c-logistics); outline-offset: 2px; }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.zoom { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.compass { font: 700 13px/1 var(--font-text); color: var(--ui-muted); min-width: 1.6em; text-align: center; }
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: #2b5d8f; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 12px; font: 500 12px/1.3 var(--font-pixel); color: #fff;
  background: rgba(17,21,31,.78); padding: 6px 9px; border-radius: 4px; pointer-events: none; }
.panel { border-left: 2px solid #0d1018; background: var(--ui-bg); overflow-y: auto; display: flex; flex-direction: column; }
.card { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px 16px; border-bottom: 1px solid var(--ui-line); background: var(--ui-bg-2); }
.card .num { font: 600 12px/1 var(--font-text); color: var(--ui-muted); letter-spacing: .04em; }
.card h2 { font: 700 20px/1.15 var(--font-pixel); margin: 4px 0 8px; text-wrap: balance; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #0f1320; border: 1px solid var(--ui-line); color: var(--ui-muted); }
.card p { margin: 0 0 10px; max-width: 60ch; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.card dt { color: var(--ui-muted); }
.card dd { margin: 0; }
.card .more { margin: 12px 0 0; }
.card .more a { color: var(--c-logistics); font-weight: 600; text-decoration: none; }
.card .more a:hover { text-decoration: underline; }
.card code { font-size: 12px; background: #0f1320; padding: 1px 5px; border-radius: 3px; }
.list { padding: 8px 0 16px; }
.list h3 { font: 700 14px/1 var(--font-pixel); margin: 14px 16px 6px; color: var(--ui-muted); letter-spacing: .05em; text-transform: uppercase; }
.party { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0;
  color: var(--ui-text); font: 13px/1.35 var(--font-text); padding: 5px 16px; cursor: pointer; }
.party:hover, .party[aria-current="true"] { background: var(--ui-bg-2); }
.party .n { font: 700 12px/1 var(--font-text); min-width: 2.6em; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
.party .new { font-size: 11px; color: var(--c-procurement); margin-left: auto; }
.foot { margin-top: auto; padding: 12px 16px; font-size: 12px; color: var(--ui-muted); border-top: 1px solid var(--ui-line); }
@media (max-width: 760px) {
  body { overflow: auto; height: auto; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { height: 62vh; min-height: 340px; }
  .panel { border-left: 0; border-top: 2px solid #0d1018; }
  .zoom { margin-left: 0; }
  .layers { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
  .layers button { flex: none; }
  .card { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
</head>
<body>
<header class="toolbar">
  <a class="back" href="index.html" title="UBL Example Documents">←</a>
  <h1>UBL <span>World</span></h1>
  <div class="layers" role="group" aria-label="Map layers">
    <button id="layer-chain" aria-pressed="true" data-layer="chain"><span class="dot" style="background:var(--c-commerce)"></span>Supply chains</button>
    <button id="layer-transport" aria-pressed="true" data-layer="transport"><span class="dot" style="background:var(--c-logistics)"></span>Transport</button>
    <button id="layer-gov" aria-pressed="true" data-layer="gov"><span class="dot" style="background:var(--c-government)"></span>Government</button>
    <button id="layer-fin" aria-pressed="true" data-layer="fin"><span class="dot" style="background:var(--c-finance)"></span>Finance</button>
    <button id="layer-proc" aria-pressed="true" data-layer="proc"><span class="dot" style="background:var(--c-procurement)"></span>Procurement</button>
  </div>
  <div class="zoom">
    <button id="rot-left" aria-label="Rotate left (Q)" title="Rotate left (Q)">⟲</button>
    <span class="compass" aria-label="View from" title="View direction"><span id="compass">N</span></span>
    <button id="rot-right" aria-label="Rotate right (E)" title="Rotate right (E)">⟳</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-fit">Fit</button>
    <button id="grid" aria-pressed="false" title="Show the tile grid">Grid</button>
  </div>
</header>

<div class="main">
  <div class="mapwrap">
    <canvas id="map" aria-label="Isometric map of the UBL example world with three countries and their parties"></canvas>
    <div class="hint">Drag to move · scroll or pinch to zoom · ⟲ ⟳ or Q / E to rotate · click a building</div>
  </div>
  <aside class="panel">
    <section class="card" id="card" aria-live="polite"></section>
    <nav class="list" id="list" aria-label="Parties"></nav>
    <p class="foot">Example world, work in progress. Countries are placeholders with ISO user-assigned codes (XA, XB, XC). Parties 27–32 are the proposed additions to the 26+C set.</p>
  </aside>
</div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------- world data
const W = 64, H = 48;               // tiles
const TW = 32, TH = 16;             // tile size in pixels (isometric)
// Countries and parties come from world/world.json; the build puts them here.
const WORLD = {"countries": {"XA": {"name": "Country A", "note": "Mainland, inland. Raw materials and manufacturing."}, "XB": {"name": "Country B", "note": "Mainland, coast. Distribution, retail, seaport and airport hub."}, "XC": {"name": "Country C", "note": "Island. The overseas buyer, reached by sea and air."}}, "parties": [{"id": "4-xa", "n": "4", "name": "Raw Material Supplier", "cat": "commerce", "c": "XA", "at": [9, 10], "h": 2, "kind": "mine", "what": "Mines the ore at the start of the chain and sells it to the manufacturer.", "docs": "Order, DespatchAdvice, Invoice", "roles": "AccountingSupplierParty, ConsignorParty", "how": "A mine sells a few products in large volumes to a small number of customers. With UBL, its orders, despatch advices and invoices carry the same quantities, lot numbers and weights from the first document to the last, so the buyer can match them without retyping weighbridge tickets.", "partners": ["5-xa", "14-xa", "23-xa"]}, {"id": "5-xa", "n": "5", "name": "Manufacturer", "cat": "commerce", "c": "XA", "at": [14, 18], "h": 3, "kind": "factory", "what": "Turns raw material into finished goods; buys from #4, sells to #6 abroad and tenders in public procurement.", "docs": "Order, OrderResponse, Invoice, Tender, CertificateOfOrigin", "roles": "SellerSupplierParty, AccountingSupplierParty, ExporterParty, EconomicOperatorParty", "how": "The manufacturer sits in the middle of the chain: it buys, produces, sells, exports and tenders. UBL gives it one vocabulary for all of that, from the order it places with the mine to the certificate of origin and the tender it submits to a public buyer, so the same item, party and price data are reused instead of re-entered for every partner.", "partners": ["4-xa", "6-xb", "8-xa", "7-xa", "23-xa", "20-xa", "2-xb", "27-xb"], "size": [2, 2]}, {"id": "8-xa", "n": "8", "name": "Seller's Warehouse (3PL)", "cat": "commerce", "c": "XA", "at": [16, 22], "h": 2, "kind": "warehouse", "what": "Picks, packs and hands the goods to the carrier for the manufacturer; knows nothing about prices.", "docs": "DespatchAdvice, InventoryReport", "roles": "DespatchParty, ConsignorParty", "how": "A third-party warehouse acts on instructions from its client but never sees the commercial terms. UBL separates the two: the warehouse sends despatch advices and inventory reports with exactly the logistic details (packages, weights, serial numbers) while prices stay in the documents between seller and buyer.", "partners": ["5-xa", "13-xa", "14-xa"], "size": [2, 1]}, {"id": "7-xa", "n": "7", "name": "Waste Processor", "cat": "commerce", "c": "XA", "at": [11, 24], "h": 2, "kind": "waste", "what": "Takes production waste from the manufacturer and invoices the removal.", "docs": "WasteNotification, WasteMovement, Invoice", "roles": "RecoveryFacilityParty, DisposalFacilityParty", "how": "Waste movements must be announced and tracked before the waste leaves the site. UBL's waste notification and waste movement documents describe the waste, its producer and the facility that recovers or disposes of it, and the same parties then appear on the invoice for the removal service.", "partners": ["5-xa", "13-xa"]}, {"id": "14-xa", "n": "14", "name": "Rail Carrier", "cat": "logistics", "c": "XA", "at": [8, 15], "h": 2, "kind": "depot", "what": "Runs the ore trains from the mine to the factory and container trains to the border.", "docs": "Waybill, TransportExecutionPlan, TransportationStatus", "roles": "CarrierParty, TransportServiceProviderParty", "how": "A rail carrier plans capacity on a fixed timetable. UBL transport documents let its customers request and confirm transport plans and receive status updates per train and wagon, with the same consignment references the forwarder and the receiving terminal use.", "partners": ["4-xa", "5-xa", "18-xa", "8-xa"]}, {"id": "13-xa", "n": "13", "name": "Road Carrier", "cat": "logistics", "c": "XA", "at": [17, 25], "h": 1, "kind": "depot", "what": "Trucks the goods across the land border to the distributor; last-mile delivery.", "docs": "Waybill, TransportationStatus, FreightInvoice", "roles": "CarrierParty", "how": "Road carriers handle many short jobs with frequent changes. With UBL they receive transport instructions, report status at each stop and invoice the freight in one structured format, so every customer, large or small, can process them automatically.", "partners": ["8-xa", "6-xb", "19-xa", "19-xb", "12-xc"]}, {"id": "15-xa", "n": "15", "name": "Inland Waterway Carrier", "cat": "logistics", "c": "XA", "at": [12, 26], "h": 1, "kind": "quay", "what": "Moves bulk on the river from Country A down to the coast of Country B.", "docs": "Waybill, TransportExecutionPlan", "roles": "CarrierParty, PerformingCarrierParty", "how": "Inland waterway transport moves large volumes slowly. UBL transport execution plans and waybills carry the barge, the loading and discharge quays and the cargo per hold, so shippers and terminals can plan around long transit times.", "partners": ["5-xa", "6-xb", "18-xa"]}, {"id": "18-xa", "n": "18", "name": "Rail Hub / Intermodal Terminal", "cat": "logistics", "c": "XA", "at": [19, 18], "h": 2, "kind": "terminal", "what": "Transfers containers between rail and road at the border; manages tracks and slots.", "docs": "TransportationStatus, CommonTransportationReport", "roles": "TerminalOperatorParty, AuthorityParty", "how": "An intermodal terminal is where rail and road meet. UBL status messages and transport reports let it tell carriers and forwarders when a container arrived, was transferred or left, using the same equipment and consignment identifiers on both sides of the transfer.", "partners": ["14-xa", "13-xa", "15-xa", "10-xb"], "size": [2, 1], "on": "rail"}, {"id": "23-xa", "n": "23", "name": "Seller's Bank", "cat": "finance", "c": "XA", "at": [12, 21], "h": 3, "kind": "bank", "what": "Holds the manufacturer's account and receives the payments from abroad.", "docs": "Invoice (PayeeFinancialAccount), RemittanceAdvice", "roles": "PayeeParty (account holder)", "how": "The seller's bank receives payments from many countries. Because UBL invoices carry the payee account and a payment reference, and remittance advices repeat that reference, incoming payments can be matched to the right invoices automatically.", "partners": ["5-xa", "22-xc", "4-xa"]}, {"id": "20-xa", "n": "20", "name": "Chamber of Commerce (XA)", "cat": "government", "c": "XA", "at": [13, 22], "h": 2, "kind": "office", "what": "Certifies the origin of the exported goods and issues ATA carnets.", "docs": "CertificateOfOrigin, GoodsItemPassport", "roles": "IssuerParty, EndorserParty, ExportingGuarantorParty", "how": "A chamber of commerce certifies that goods come from where the exporter says. UBL certificate-of-origin and goods-item-passport documents carry the application, the endorsements and the goods in a form customs on the other side can read and verify.", "partners": ["5-xa", "19-xa", "20-xc"]}, {"id": "19-xa", "n": "19", "name": "Customs (XA)", "cat": "government", "c": "XA", "at": [20, 22], "h": 1, "kind": "customs", "what": "Export customs at the land border crossing.", "docs": "ExportCustomsDeclaration, GoodsItemPassport", "roles": "CustomsParty, ExportingCustomsParty", "how": "Export customs needs to know what leaves the country, for whom and how. UBL customs declarations reuse the parties, goods and transport details already present in the commercial and transport documents, so the declarant does not have to collect them again.", "partners": ["5-xa", "13-xa", "19-xb", "3-xc"], "on": "road"}, {"id": "31-xa", "n": "31", "name": "Identifier Issuing Agency", "cat": "government", "c": "XA", "at": [11, 22], "h": 2, "kind": "office", "proposed": true, "what": "Issues item and property identifiers used across the world (a fictional numbering organisation).", "docs": "Catalogue, Item identifiers in every document", "roles": "IssuerParty (ItemIdentification, PropertyIdentification)", "how": "Everyone in the world refers to the same products and properties. An identifier issuing agency gives those items and properties stable identifiers, which UBL documents carry in their identification elements, so a catalogue line, an order line and an invoice line point to exactly the same thing.", "partners": ["6-xb", "5-xa"]}, {"id": "19-xb", "n": "19", "name": "Customs (XB)", "cat": "government", "c": "XB", "at": [23, 22], "h": 1, "kind": "customs", "what": "Import customs at the land border crossing and at the seaport.", "docs": "ImportCustomsDeclaration, TransitCustomsDeclaration", "roles": "CustomsParty, ImportingCustomsParty", "how": "Import customs checks goods arriving over the land border and through the seaport. UBL import and transit declarations carry the same consignment and goods data as the export declaration on the other side, which makes it possible to compare them.", "partners": ["19-xa", "13-xa", "6-xb", "16-xb"], "on": "road"}, {"id": "6-xb", "n": "6", "name": "Distributor", "cat": "commerce", "c": "XB", "at": [28, 26], "h": 3, "kind": "warehouse", "what": "Buys finished goods from #5, stocks them in its distribution centre, publishes the catalogue and sells to #26 and overseas to #1.", "docs": "Catalogue, Order, DespatchAdvice, Invoice, ReceiptAdvice", "roles": "SellerSupplierParty, BuyerCustomerParty, ProviderParty", "how": "The distributor publishes the catalogue its customers order from, buys from manufacturers and sells at home and overseas. UBL links all of it: catalogue items appear unchanged in orders, orders are referenced by despatch advices and invoices, and receipt advices confirm what actually arrived.", "partners": ["5-xa", "26-xb", "1-xc", "10-xb", "24-xb", "19-xb"], "size": [2, 2]}, {"id": "26-xb", "n": "26", "name": "Retailer", "cat": "commerce", "c": "XB", "at": [33, 30], "h": 2, "kind": "shop", "what": "Buys from the distributor, sells to consumers; shares forecasts and promotions.", "docs": "Order, Forecast, RetailEvent, PurchaseReceipt", "roles": "BuyerCustomerParty, RetailerCustomerParty", "how": "A retailer buys from the distributor and sells to consumers. Besides orders and invoices, UBL lets it share forecasts, promotions and sales data with its supplier, and issue a structured purchase receipt to the consumer.", "partners": ["6-xb", "c-xb"]}, {"id": "c-xb", "n": "C", "name": "Consumer", "cat": "commerce", "c": "XB", "at": [35, 31], "h": 1, "kind": "house", "what": "A private person buying in the shop; receives a purchase receipt.", "docs": "PurchaseReceipt", "roles": "AccountingCustomerParty (PurchaseReceipt)", "how": "A consumer rarely deals with UBL directly, but a structured purchase receipt means the receipt can be stored, searched or used for a warranty claim without a paper slip.", "partners": ["26-xb"]}, {"id": "2-xb", "n": "2", "name": "Contracting Authority", "cat": "procurement", "c": "XB", "at": [32, 27], "h": 4, "kind": "townhall", "what": "A public body that buys under procurement law: publishes notices, receives and evaluates tenders.", "docs": "ContractNotice, CallForTenders, ContractAwardNotice", "roles": "ContractingParty, TenderRecipientParty, TenderEvaluationParty", "how": "A contracting authority has to buy in a transparent and comparable way. UBL tendering documents take it from the prior information notice to the contract award, so tenders arrive in a structured form that can be checked and evaluated consistently.", "partners": ["21-xb", "5-xa", "27-xb", "28-xb", "25-xb"]}, {"id": "27-xb", "n": "27", "name": "Consortium Partner", "cat": "procurement", "c": "XB", "at": [26, 30], "h": 2, "kind": "office", "proposed": true, "what": "Tenders together with the manufacturer as consortium partner or subcontractor.", "docs": "Tender, TendererQualification", "roles": "SubcontractorParty, AdditionalQualifyingParty", "how": "A consortium partner tenders together with a main tenderer. UBL tenders and qualification documents name each partner and its qualifications separately, so the authority can see who contributes what.", "partners": ["5-xa", "2-xb"]}, {"id": "28-xb", "n": "28", "name": "Review Body", "cat": "procurement", "c": "XB", "at": [34, 26], "h": 3, "kind": "office", "proposed": true, "what": "Independent body that handles appeals and mediation in public procurement.", "docs": "ContractNotice, ContractAwardNotice (AppealTerms)", "roles": "AppealReceiverParty, MediationParty", "how": "A review body handles appeals against procurement decisions. The tendering documents name it, with the deadlines for an appeal, so every tenderer knows where and when to go.", "partners": ["2-xb", "5-xa"]}, {"id": "21-xb", "n": "21", "name": "Government Information Service", "cat": "government", "c": "XB", "at": [31, 25], "h": 3, "kind": "office", "what": "Publishes procurement notices and keeps the business registry.", "docs": "PriorInformationNotice, BusinessInformation", "roles": "ReceiverParty (notices), EvidenceIssuingParty", "how": "A government information service publishes procurement notices and keeps the business registry. UBL notices reach it in one structured format, and business information documents let it share registry data that tenderers can reuse as evidence.", "partners": ["2-xb", "5-xa", "6-xb"]}, {"id": "32-xb", "n": "32", "name": "Digital Agreement Governor", "cat": "government", "c": "XB", "at": [30, 29], "h": 2, "kind": "office", "proposed": true, "what": "Governs the multilateral digital agreement under which the parties exchange UBL documents.", "docs": "DigitalAgreement, DigitalCapability", "roles": "GovernorParty", "how": "A digital agreement sets out which documents the participants exchange and under which rules. UBL's digital agreement and digital capability documents describe that framework, and its governor keeps it up to date for all participants.", "partners": ["5-xa", "6-xb", "1-xc"]}, {"id": "24-xb", "n": "24", "name": "Factor", "cat": "finance", "c": "XB", "at": [31, 31], "h": 3, "kind": "bank", "what": "Buys the distributor's receivables and becomes the payee on its invoices.", "docs": "Invoice, Statement", "roles": "PayeeParty", "how": "A factor buys the distributor's invoices and collects the payment. UBL invoices can name the factor as payee, with its account, so the buyer pays the right party without a separate letter.", "partners": ["6-xb", "1-xc"]}, {"id": "25-xb", "n": "25", "name": "Guarantor", "cat": "finance", "c": "XB", "at": [33, 32], "h": 2, "kind": "bank", "what": "Issues guarantees, such as the bid bond for a tender.", "docs": "GuaranteeCertificate", "roles": "GuarantorParty", "how": "A guarantor stands surety, for example for a bid bond in a tender. UBL's guarantee certificate names the guarantee, the tenderer and the contracting authority, so the authority can check it is valid.", "partners": ["5-xa", "2-xb"]}, {"id": "29-xb", "n": "29", "name": "Insurer", "cat": "finance", "c": "XB", "at": [34, 29], "h": 3, "kind": "bank", "proposed": true, "what": "Insures the cargo on its way overseas.", "docs": "BillOfLading, Waybill (InsurancePolicy)", "roles": "InsurerParty", "how": "An insurer covers the cargo while it travels. UBL transport documents can carry the insurance policy with the insurer, the policy holder and the insured value, so every party in the transport chain knows the goods are covered.", "partners": ["10-xb", "6-xb", "11-xb"]}, {"id": "10-xb", "n": "10", "name": "Freight Forwarder", "cat": "logistics", "c": "XB", "at": [36, 25], "h": 2, "kind": "office", "what": "Books the transport, consolidates shipments and prepares the export documents; also arranges cargo insurance.", "docs": "ForwardingInstructions, PackingList, Manifest", "roles": "FreightForwarderParty, LogisticsOperatorParty, BrokerParty", "how": "A freight forwarder organises transport for others. It uses UBL forwarding instructions, packing lists and manifests to combine shipments, book carriers and arrange insurance, keeping one consignment reference across all of them.", "partners": ["6-x     p._sx = x; p._sy = y; const text = (view.s > 1.15 || p === selected) ? `#${p.n} ${p.name}` : `#${p.n}`;
    const [w, h] = signBox(ctx, text, p === selected), rect = [x - w / 2 - 2, y - h - 2, x + w / 2 + 2, y + 2];
    const free = !placed.some(q => rect[0] < q[2] && rect[2] > q[0] && rect[1] < q[3] && rect[3] > q[1]);
    if (free || p === selected) { placed.push(rect); todo.push([p, x, y, text, true]); } else todo.push([p, x, y, text, false]); }
  for (const [p, x, y, text, full] of todo.reverse()) full ? sign(ctx, x, y, text, css(CAT[p.cat]), p === selected) : dot(ctx, x, y, css(CAT[p.cat]));
  if (selected && selected._sx != null) sign(ctx, selected._sx, selected._sy, `#${selected.n} ${selected.name}`, css(CAT[selected.cat]), true);
  if (!reduced) requestAnimationFrame(frame);
}
const redraw = () => { if (reduced) frame(0); };

// panel
const card = document.getElementById("card"), list = document.getElementById("list");
function showCard(p) {
  if (!p) { card.innerHTML = `<div class="num">THE UBL EXAMPLE WORLD</div><h2>Three countries, 38 places, one story</h2>
    <p>Ore is mined and processed in <b>Country A</b>, crosses the land border by road, rail and river to the distributor in <b>Country B</b>, and goes overseas by ship and plane to the buyer on the island <b>Country C</b>. Every country has its own customs, chamber and banks.</p>
    <p>Click a building or choose a party below to see its role and the UBL documents it sends and receives.</p>`; return; }
  const col = css(CAT[p.cat]);
  card.innerHTML = `<div class="num">PARTY #${p.n}${p.proposed ? " · PROPOSED" : ""}</div><h2 style="color:${col}">${p.name}</h2>
    <div class="tags"><span class="tag">${COUNTRIES[p.c].name} (${p.c})</span><span class="tag">${p.cat}</span></div>
    <p>${p.what}</p><dl><dt>Documents</dt><dd>${p.docs}</dd><dt>UBL roles</dt><dd><code>${p.roles.split(", ").join("</code> <code>")}</code></dd></dl>
    <p class="more"><a href="world-${p.id}.html">How UBL helps ${p.name.replace(/ \(X.\)$/, "")} →</a></p>`;
}
function select(p, center) { selected = p; showCard(p);
  history.replaceState(null, "", p ? "#" + p.id : location.pathname);
  for (const b of list.querySelectorAll(".party")) b.setAttribute("aria-current", b._p === p ? "true" : "false");
  if (p && center) { const r = cv.getBoundingClientRect(); const [wx, wy] = tileWorld(...p.at); view.s = Math.max(view.s, 1.4); view.x = r.width / 2 - wx * view.s; view.y = r.height / 2 - wy * view.s; }
  redraw(); }
for (const code of ["XA", "XB", "XC"]) { const h = document.createElement("h3"); h.textContent = `${COUNTRIES[code].name} · ${code}`; list.appendChild(h);
  for (const p of P.filter(p => p.c === code).sort((a, b) => (parseInt(a.n) || 99) - (parseInt(b.n) || 99))) {
    const b = document.createElement("button"); b.className = "party"; b._p = p; b.type = "button";
    b.innerHTML = `<span class="n" style="color:${css(CAT[p.cat])}">#${p.n}</span><span>${p.name}</span>${p.proposed ? '<span class="new">new</span>' : ""}`;
    b.addEventListener("click", () => select(p, true)); list.appendChild(b); } }

// layer toggles
for (const b of document.querySelectorAll(".layers button")) b.addEventListener("click", () => {
  const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); layers[b.dataset.layer] = on; redraw(); });
// pan and zoom
const zoomAt = (f, cx, cy) => { const ns = Math.max(.35, Math.min(3, view.s * f)); view.x = cx - (cx - view.x) * ns / view.s; view.y = cy - (cy - view.y) * ns / view.s; view.s = ns; redraw(); };
document.getElementById("zoom-in").onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
document.getElementById("zoom-out").onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(.8, r.width / 2, r.height / 2); };
document.getElementById("zoom-fit").onclick = () => { fit(); redraw(); };
document.getElementById("grid").onclick = e => { showGrid = !showGrid; e.currentTarget.setAttribute("aria-pressed", showGrid); drawWorld(); redraw(); };
document.getElementById("rot-left").onclick = () => rotate(-1);
document.getElementById("rot-right").onclick = () => rotate(1);
window.addEventListener("keydown", e => { if (e.target.closest("input, textarea")) return;
  if (e.key === "q" || e.key === "Q") rotate(-1); else if (e.key === "e" || e.key === "E") rotate(1);
  else if (e.key === "+" || e.key === "=") document.getElementById("zoom-in").click(); else if (e.key === "-") document.getElementById("zoom-out").click(); });
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : .89, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pointers = new Map(); let moved = 0, pinch = 0;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; cv.classList.add("dragging"); });
cv.addEventListener("pointermove", e => { if (!pointers.has(e.pointerId)) return; const [px, py] = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = cv.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; moved += 10; return; }
  view.x += e.clientX - px; view.y += e.clientY - py; moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py); redraw(); });
const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = 0; cv.classList.remove("dragging");
  if (moved < 5 && e.type === "pointerup") { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 30; for (const p of P) { if (p._sx == null) continue; const d = Math.hypot(p._sx - x, p._sy - y + 6); if (d < bd) { bd = d; best = p; } }
    select(best, false); } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

window.addEventListener("resize", () => { view.fitted = false; resize(); redraw(); });
document.fonts?.ready.then(() => { drawWorld(); redraw(); });
drawWorld(); resize(); showCard(null);
const fromHash = () => { const p = P.find(p => "#" + p.id === location.hash); if (p) select(p, true); };
fromHash(); window.addEventListener("hashchange", fromHash);
if (reduced) frame(0); else requestAnimationFrame(frame);
})();
</script>

</body>
